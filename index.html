<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>B-Gnome — Lawn Battle</title>
<!-- design
Core verb: hit (the called breakdance move, on the beat).
Loop: 10 s — a garden critter calls a move, you fire it on the downbeat. 1 min — calls come every bar, then two per bar.
Run ends: hype meter hits zero (booed off the lawn) or you survive the 48-bar track (Lawn Legend).
Pressure: hype drains constantly; misses and wrong moves cost a lot; call rate doubles at bar 24 and again at bar 40.
Choice: during the Sprinkler break (bars 16-24) any move on the beat scores, but the gnome needs a beat to land each move,
  so you pick between safe toprock and greedy back-to-back power moves.
Surprise: the sprinklers kick on mid-song and the lawn becomes a free-for-all.
Moves (always moving — he toprocks between moves): Six-Step, Hat Spin (on his hat tip), Windmill, Flare.
Art: glazed-ceramic garden gnome, smooth lathe/spline meshes, PBR shading with sky reflections, soft shadows,
  bump detail (beard strands, felt hat, fabric, leather), 30k grass blades, picket fence, flowers, golden-hour light.
Sound: synthesized boom-bap at 96 BPM, all Web Audio.
-->
<style>
:root{--ink:#fff8ec;--glass:rgba(20,26,22,.48);--hot:#ffcf5a}
html,body{margin:0;height:100%;overflow:hidden;background:#9fb9d6;touch-action:none;user-select:none;-webkit-user-select:none;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--ink)}
canvas{display:block;width:100vw;height:100vh;cursor:grab}
canvas:active{cursor:grabbing}
.hide{display:none!important}
#hud{position:fixed;left:0;right:0;top:0;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;pointer-events:none}
.pill{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;padding:8px 14px;font-weight:700;letter-spacing:.02em;box-shadow:0 4px 18px #0003}
#score{font-size:22px;min-width:90px}
#combo{font-size:14px;opacity:.9}
#hypeWrap{flex:1;max-width:360px}
#hypeLbl{font-size:11px;letter-spacing:.2em;opacity:.8;margin-bottom:4px}
#hypeBar{height:10px;border-radius:6px;background:#0005;overflow:hidden}
#hype{height:100%;width:60%;background:linear-gradient(90deg,#ff6a3d,#ffcf5a,#9dff7a);border-radius:6px;transition:width .15s}
#calls{position:fixed;left:50%;top:76px;transform:translateX(-50%);display:flex;gap:10px;pointer-events:none}
.call{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:6px 16px 6px 6px;font-weight:800;font-size:18px;box-shadow:0 6px 20px #0004;transition:transform .1s}
.call .ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:conic-gradient(var(--hot) var(--p,0%),#ffffff22 0)}
.call .ring span{width:32px;height:32px;border-radius:50%;background:#1e2a22;display:grid;place-items:center}
.call.now{transform:scale(1.12);background:#ffcf5acc;color:#2a1a00}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:clamp(28px,6vw,64px);letter-spacing:.08em;text-shadow:0 4px 24px #0006;pointer-events:none;opacity:0;transition:opacity .3s}
#judge{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(26px,5vw,48px);letter-spacing:.06em;pointer-events:none;text-shadow:0 3px 16px #0007;opacity:0}
#judge.pop{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
#moves{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px}
#moves button{appearance:none;border:0;border-radius:18px;min-width:78px;height:72px;padding:6px 10px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);font:800 13px/1.1 inherit;font-family:inherit;box-shadow:0 6px 18px #0004;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .08s,background .2s}
#moves button b{font-size:24px;line-height:1}
#moves button i{font-style:normal;font-size:10px;opacity:.65;font-weight:600}
#moves button.on{background:#ffcf5ad9;color:#2a1a00;transform:translateY(-3px)}
#moves button.want{box-shadow:0 0 0 3px var(--hot),0 6px 18px #0004}
#title,#over,#pause{position:fixed;inset:0;display:grid;place-items:end center;padding-bottom:110px;pointer-events:none;background:linear-gradient(#0000 40%,#0006)}
.card{pointer-events:auto;text-align:center;max-width:560px;margin:0 16px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:24px;padding:20px 26px;box-shadow:0 10px 40px #0005}
.card h1{margin:0;font-size:clamp(40px,9vw,76px);font-weight:900;letter-spacing:.04em;line-height:1;background:linear-gradient(#fff3c4,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7a2a10)}
.card p{margin:.6em 0;opacity:.92;line-height:1.45}
.card .small{font-size:13px;opacity:.75}
.btns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.btns button{appearance:none;border:0;border-radius:14px;padding:12px 22px;font:800 16px inherit;font-family:inherit;cursor:pointer;background:#ffcf5a;color:#2a1a00;box-shadow:0 4px 0 #b07a1a}
.btns button.alt{background:#ffffff26;color:var(--ink);box-shadow:none}
#err{position:fixed;inset:0;display:none;place-items:center;background:#222;color:#fff;font:16px system-ui;text-align:center;padding:20px}
#beat{position:fixed;right:16px;bottom:100px;width:14px;height:14px;border-radius:50%;background:var(--hot);opacity:.25;pointer-events:none}
@media (max-width:560px){#moves button{min-width:70px;height:64px}#moves{gap:7px}#calls{top:70px}.call{font-size:15px}#score{font-size:18px}#title,#over,#pause{padding-bottom:100px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hide">
  <div class="pill"><div id="score">0</div><div id="combo">combo 0</div></div>
  <div id="hypeWrap" class="pill"><div id="hypeLbl">CROWD HYPE</div><div id="hypeBar"><div id="hype"></div></div></div>
</div>
<div id="calls"></div>
<div id="banner"></div>
<div id="judge"></div>
<div id="beat"></div>
<div id="moves">
  <button data-m="six"><b>←</b>Six-Step<i>1</i></button>
  <button data-m="hat"><b>↑</b>Hat Spin<i>2</i></button>
  <button data-m="mill"><b>→</b>Windmill<i>3</i></button>
  <button data-m="flare"><b>↓</b>Flare<i>4</i></button>
</div>
<div id="title"><div class="card">
  <h1>B-GNOME</h1>
  <p>A breakdance battle on the back lawn. The garden calls a move — hit it <b>on the beat</b>. Keep the crowd hyped.</p>
  <p class="small" id="hint"></p>
  <p class="small" id="load">Sculpting the gnome… 0%</p>
  <div class="btns"><button id="go">Battle</button><button id="free" class="alt">Free dance</button></div>
</div></div>
<div id="over" class="hide"><div class="card">
  <h1 id="overT">Lawn Legend</h1>
  <p id="overS"></p>
  <div class="btns"><button id="again">Battle again</button><button id="free2" class="alt">Free dance</button></div>
</div></div>
<div id="pause" class="hide"><div class="card"><h1 style="font-size:44px">Paused</h1><p id="pauseHint"></p></div></div>
<div id="err">This needs a browser with WebGL2.</div>
<script>
"use strict";
// =====================================================================
// CONFIG
// =====================================================================
const QS=new URLSearchParams(location.search), AUTO=QS.has('autoplay');
const COARSE=matchMedia('(pointer:coarse)').matches;
const QUAL=QS.get('q')||(COARSE?'low':'med');
const TIER={low:{grass:17000,sm:1024,dpr:1.25},med:{grass:42000,sm:2048,dpr:1.5},high:{grass:70000,sm:2048,dpr:2}}[QUAL]||{grass:42000,sm:2048,dpr:1.5};
const CONFIG={bpm:96,songBars:48,win:.45,perfect:.12,great:.25,hype0:60,drain:.9,hitHype:7,perfHype:11,missHype:17,
  sun:norm3([.62,.44,.52]),moveBeats:4};
const SPB=60/CONFIG.bpm;
let seed=+(QS.get('seed')||((Math.random()*1e9)|0));
function rnd(){seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const R=(a,b)=>a+(b-a)*rnd();

// =====================================================================
// MATH
// =====================================================================
function norm3(v){const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l];}
const sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const cross3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function I4(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;}
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];}return o;}
function M(...ms){let o=ms[0];for(let i=1;i<ms.length;i++)o=mul(o,ms[i]);return o;}
function T(x,y,z){const m=I4();m[12]=x;m[13]=y;m[14]=z;return m;}
function S(x,y,z){const m=I4();m[0]=x;m[5]=y===undefined?x:y;m[10]=z===undefined?x:z;return m;}
function RX(a){const c=Math.cos(a),s=Math.sin(a),m=I4();m[5]=c;m[6]=s;m[9]=-s;m[10]=c;return m;}
function RY(a){const c=Math.cos(a),s=Math.sin(a),m=I4();m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m;}
function RZ(a){const c=Math.cos(a),s=Math.sin(a),m=I4();m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m;}
function persp(fy,as,n,f){const t=1/Math.tan(fy/2),m=new Float32Array(16);m[0]=t/as;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m;}
function ortho(l,r,b,t,n,f){const m=I4();m[0]=2/(r-l);m[5]=2/(t-b);m[10]=-2/(f-n);m[12]=-(r+l)/(r-l);m[13]=-(t+b)/(t-b);m[14]=-(f+n)/(f-n);return m;}
function lookAt(e,t,u){const f=norm3(sub3(t,e)),s=norm3(cross3(f,u)),v=cross3(s,f),m=I4();
  m[0]=s[0];m[4]=s[1];m[8]=s[2];m[1]=v[0];m[5]=v[1];m[9]=v[2];m[2]=-f[0];m[6]=-f[1];m[10]=-f[2];
  m[12]=-dot3(s,e);m[13]=-dot3(v,e);m[14]=dot3(f,e);return m;}
function nmat(m){const a=m[0],b=m[1],c=m[2],d=m[4],e=m[5],f=m[6],g=m[8],h=m[9],i=m[10];
  const A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g,det=a*A+b*B+c*C||1e-9,q=1/det;
  return new Float32Array([A*q,B*q,C*q,-(b*i-c*h)*q,(a*i-c*g)*q,-(a*h-b*g)*q,(b*f-c*e)*q,-(a*f-c*d)*q,(a*e-b*d)*q]);}
function inv4(m){const o=new Float32Array(16),[a,b,c,d,e,f,g,h,i,j,k,l,n,p,q,r]=m;
  const A=k*r-l*q,B=j*r-l*p,C=j*q-k*p,D=i*r-l*n,E=i*q-k*n,F=i*p-j*n,G=g*r-h*q,H=f*r-h*p,II=f*q-g*p,J=e*r-h*n,K=e*q-g*n,L=e*p-f*n,
  MM=g*l-h*k,N=f*l-h*j,O=f*k-g*j,P=e*l-h*i,Q=e*k-g*i,RR=e*j-f*i,det=a*(f*A-g*B+h*C)-b*(e*A-g*D+h*E)+c*(e*B-f*D+h*F)-d*(e*C-f*E+g*F),z=1/det;
  o[0]=(f*A-g*B+h*C)*z;o[1]=-(b*A-c*B+d*C)*z;o[2]=(b*G-c*H+d*II)*z;o[3]=-(b*MM-c*N+d*O)*z;o[4]=-(e*A-g*D+h*E)*z;o[5]=(a*A-c*D+d*E)*z;o[6]=-(a*G-c*J+d*K)*z;o[7]=(a*MM-c*P+d*Q)*z;
  o[8]=(e*B-f*D+h*F)*z;o[9]=-(a*B-b*D+d*F)*z;o[10]=(a*H-b*J+d*L)*z;o[11]=-(a*N-b*P+d*RR)*z;o[12]=-(e*C-f*E+g*F)*z;o[13]=(a*C-b*E+c*F)*z;o[14]=-(a*II-b*K+c*L)*z;o[15]=(a*O-b*Q+c*RR)*z;return o;}
const tp=(m,p)=>[m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]];
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), ease=t=>t*t*(3-2*t);

// =====================================================================
// GEOMETRY (smooth parametric surfaces — no boxes)
// =====================================================================
function surf(f,us,vs){const P=[],N=[],Ix=[],e=1e-3;
  for(let j=0;j<=vs;j++){const v=j/vs;for(let i=0;i<=us;i++){const u=i/us,p=f(u,v);
    let n=cross3(sub3(f(u,Math.min(1,v+e)),f(u,Math.max(0,v-e))),sub3(f(u+e,v),f(u-e,v))),l=Math.hypot(...n);
    if(l<1e-10){const v2=v<.5?v+.02:v-.02;n=cross3(sub3(f(u,v2+e),f(u,v2-e)),sub3(f(u+e,v2),f(u-e,v2)));l=Math.hypot(...n)||1;}
    P.push(p[0],p[1],p[2]);N.push(n[0]/l,n[1]/l,n[2]/l);}}
  for(let j=0;j<vs;j++)for(let i=0;i<us;i++){const a=j*(us+1)+i,b=a+1,c=a+us+1,d=c+1;Ix.push(a,b,c,b,d,c);}
  return{p:P,n:N,i:Ix};}
function smooth(pts,k=6){const o=[];const g=i=>pts[clamp(i,0,pts.length-1)];
  for(let i=0;i<pts.length-1;i++)for(let s=0;s<k;s++){const t=s/k,p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    o.push([0,1].map(a=>.5*((2*p1[a])+(-p0[a]+p2[a])*t+(2*p0[a]-5*p1[a]+4*p2[a]-p3[a])*t*t+(-p0[a]+3*p1[a]-3*p2[a]+p3[a])*t*t*t)));}
  o.push(pts[pts.length-1]);return o;}
function lathe(prof,us=40,vs){const n=prof.length;vs=vs||Math.max(n*2,24);
  return surf((u,v)=>{const x=v*(n-1),i=Math.min(n-2,Math.floor(x)),t=x-i,r=lerp(prof[i][0],prof[i+1][0],t),y=lerp(prof[i][1],prof[i+1][1],t),a=u*Math.PI*2;
    return[r*Math.cos(a),y,r*Math.sin(a)];},us,vs);}
function sphere(r=1,us=36,vs=24){return surf((u,v)=>{const a=u*Math.PI*2,b=v*Math.PI-Math.PI/2;return[r*Math.cos(b)*Math.cos(a),r*Math.sin(b),r*Math.cos(b)*Math.sin(a)];},us,vs);}
function blob(r,amp,fr,s,us=40,vs=28){return surf((u,v)=>{const a=u*Math.PI*2,b=v*Math.PI-Math.PI/2,d=[Math.cos(b)*Math.cos(a),Math.sin(b),Math.cos(b)*Math.sin(a)];
  const k=1+amp*(Math.sin(d[0]*fr+s)*Math.sin(d[1]*fr*1.3+s*2)*Math.sin(d[2]*fr*.9+s*3)+.5*Math.sin(d[0]*fr*2.3+d[2]*fr*1.7+s));return d.map(x=>x*r*k);},us,vs);}
const spow=(x,e)=>Math.sign(x)*Math.pow(Math.abs(x),e);
function rbox(w,h,d,e=.18,us=32,vs=20){return surf((u,v)=>{const a=u*Math.PI*2,b=v*Math.PI-Math.PI/2;
  return[w/2*spow(Math.cos(b),e)*spow(Math.cos(a),e),h/2*spow(Math.sin(b),e),d/2*spow(Math.cos(b),e)*spow(Math.sin(a),e)];},us,vs);}
function torus(Rr,r,us=48,vs=16){return surf((u,v)=>{const a=u*Math.PI*2,b=v*Math.PI*2;return[(Rr+r*Math.cos(b))*Math.cos(a),r*Math.sin(b),(Rr+r*Math.cos(b))*Math.sin(a)];},us,vs);}
function capsule(L,r0,r1,us=28){const p=[];const k=10;
  for(let i=0;i<=k;i++){const a=-Math.PI/2+i/k*Math.PI/2;p.push([r1*Math.cos(a),-L+r1*Math.sin(a)]);}
  for(let i=0;i<=k;i++){const a=i/k*Math.PI/2;p.push([r0*Math.cos(a),r0*Math.sin(a)]);}
  return lathe(p,us,40);}
// merge many transformed geometries (with per-part colour) into one
function merge(parts){const P=[],N=[],C=[],Ix=[];
  for(const{g,m,c}of parts){const base=P.length/3,nm=nmat(m);
    for(let i=0;i<g.p.length;i+=3){const q=tp(m,[g.p[i],g.p[i+1],g.p[i+2]]);P.push(...q);
      const a=g.n[i],b=g.n[i+1],d=g.n[i+2];const nn=norm3([nm[0]*a+nm[3]*b+nm[6]*d,nm[1]*a+nm[4]*b+nm[7]*d,nm[2]*a+nm[5]*b+nm[8]*d]);N.push(...nn);C.push(...(c||[1,1,1]));}
    for(const ix of g.i)Ix.push(ix+base);}
  return{p:P,n:N,c:C,i:Ix};}

// =====================================================================
// GL
// =====================================================================
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{antialias:true,alpha:false,powerPreference:'high-performance'});
if(!gl){document.getElementById('err').style.display='grid';throw new Error('WebGL2 unavailable');}
function upload(g){const vao=gl.createVertexArray();gl.bindVertexArray(vao);
  const ab=(arr,loc,n)=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,n,gl.FLOAT,false,0,0);};
  ab(g.p,0,3);ab(g.n,1,3);if(g.c)ab(g.c,2,3);else{gl.disableVertexAttribArray(2);gl.vertexAttrib3f(2,1,1,1);}
  const eb=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,eb);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(g.i),gl.STATIC_DRAW);
  return{vao,n:g.i.length,hasC:!!g.c};}
function program(vs,fs,defs=''){const p=gl.createProgram();
  for(const[t,s]of[[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){const sh=gl.createShader(t);gl.shaderSource(sh,'#version 300 es\n'+defs+'precision highp float;precision highp sampler2DShadow;\n'+s);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(sh));throw new Error('shader');}gl.attachShader(p,sh);}
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(p));throw new Error('link');}
  const u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const nm=gl.getActiveUniform(p,i).name.replace('[0]','');u[nm]=gl.getUniformLocation(p,nm);}return{p,u};}

const GLSL_COMMON=`
uniform vec3 uSun,uCam;uniform float uT;
float h31(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
  mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*vn(p);p*=2.03;a*=.5;}return s;}

  for(const p of parts){p.v[1]-=p.g*dt;const dr=Math.exp(-p.drag*dt);p.v[0]*=dr;p.v[2]*=dr;p.v[1]*=dr;p.p[0]+=p.v[0]*dt;p.p[1]+=p.v[1]*dt;p.p[2]+=p.v[2]*dt;
    if(p.p[1]<.01){p.p[1]=.01;p.v[1]*=-.2;p.v[0]*=.5;p.v[2]*=.5;}p.l-=dt;}
  for(let i=parts.length-1;i>=0;i--)if(parts[i].l<=0)parts.splice(i,1);

  cam.idle+=dt;if(cam.idle>2.5)cam.tYaw+=dt*.16;if(cam.rel!==undefined){cam.tYaw=cam.yaw=pose.yaw+cam.rel;}
  const portrait=innerWidth<innerHeight;const dm=portrait?1.55:1;
  cam.yaw+=(cam.tYaw-cam.yaw)*Math.min(1,dt*6);cam.pit+=(cam.tPit-cam.pit)*Math.min(1,dt*6);cam.dist+=(cam.tDist-cam.dist)*Math.min(1,dt*6);
  shake*=Math.pow(.01,dt);
  const tgt=[pose.px*.5,(cam.ty!==undefined?cam.ty:.36)+(portrait?.12:0),pose.pz*.5],D=cam.dist*dm;
  const eye=[tgt[0]+D*Math.sin(cam.yaw)*Math.cos(cam.pit)+(rnd()-.5)*shake*.03,tgt[1]+D*Math.sin(cam.pit),tgt[2]+D*Math.cos(cam.yaw)*Math.cos(cam.pit)];
  focusDist=Math.hypot(eye[0]-pose.px,eye[1]-Math.max(.3,pose.py),eye[2]-pose.pz);
  const asp=cv.width/cv.height,proj=persp(portrait?.95:.72,asp,.03,80),view=lookAt(eye,tgt,[0,1,0]),VP=mul(proj,view);
  const sun=CONFIG.sun,lpos=[sun[0]*6,sun[1]*6,sun[2]*6],LVP=mul(ortho(-2.6,2.6,-2.6,2.6,.5,14),lookAt(lpos,[0,0,0],[0,1,0]));

  const dyn=dynamicList(pulse),looks=F?eyeLook(F,eye):null;
  // shadow pass
  gl.bindFramebuffer(gl.FRAMEBUFFER,smFB);gl.viewport(0,0,SMS,SMS);gl.clear(gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
  gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(1.5,3);
  gl.useProgram(PD.p);gl.uniformMatrix4fv(PD.u.uLVP,false,LVP);drawList(dyn,true);drawList(shadowStatic,true);if(GN.ready){gl.useProgram(PKD.p);gl.uniformMatrix4fv(PKD.u.uLVP,false,LVP);drawGnome(true);}
  gl.disable(gl.POLYGON_OFFSET_FILL);
  // main pass
  gl.bindFramebuffer(gl.FRAMEBUFFER,POST?FBS.ms:null);gl.viewport(0,0,cv.width,cv.height);gl.clearColor(.6,.7,.8,1);for(const pr of[PS,PM,PG,PK]){gl.useProgram(pr.p);if(pr.u.uPost)gl.uniform1f(pr.u.uPost,POST?1:0);}gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.depthMask(false);gl.useProgram(PS.p);gl.uniformMatrix4fv(PS.u.uIVP,false,inv4(VP));gl.uniform3fv(PS.u.uSun,sun);gl.uniform1f(PS.u.uT,now);gl.bindVertexArray(null);gl.drawArrays(gl.TRIANGLES,0,3);gl.depthMask(true);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,smTex);
  gl.useProgram(PM.p);const u=PM.u;gl.uniformMatrix4fv(u.uVP,false,VP);gl.uniformMatrix4fv(u.uLVP,false,LVP);gl.uniform3fv(u.uSun,sun);gl.uniform3fv(u.uCam,eye);
  gl.uniform1f(u.uT,now);gl.uniform1i(u.uSM,0);gl.uniform1f(u.uSMt,1/SMS);gl.uniform1f(u.uPulse,pulse);
  drawList(staticList,false);drawList(dyn,false);
  gl.useProgram(PL.p);gl.uniformMatrix4fv(PL.u.uVP,false,VP);gl.uniformMatrix4fv(PL.u.uLVP,false,LVP);gl.uniform3fv(PL.u.uSun,sun);gl.uniform3fv(PL.u.uCam,eye);gl.uniform1f(PL.u.uT,now);
  gl.uniform1i(PL.u.uSM,0);gl.uniform1f(PL.u.uSMt,1/SMS);if(PL.u.uPost)gl.uniform1f(PL.u.uPost,POST?1:0);gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);gl.bindVertexArray(leafVAO);gl.drawArraysInstanced(gl.TRIANGLES,0,6,leafN);gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  if(GN.ready){gl.useProgram(PK.p);const k=PK.u;gl.uniformMatrix4fv(k.uVP,false,VP);gl.uniformMatrix4fv(k.uLVP,false,LVP);gl.uniform3fv(k.uSun,sun);gl.uniform3fv(k.uCam,eye);gl.uniform1f(k.uT,now);gl.uniform1i(k.uSM,0);gl.uniform1f(k.uSMt,1/SMS);drawGnome(false,looks);}
  gl.useProgram(PG.p);gl.uniformMatrix4fv(PG.u.uVP,false,VP);gl.uniformMatrix4fv(PG.u.uLVP,false,LVP);gl.uniform3fv(PG.u.uSun,sun);gl.uniform3fv(PG.u.uCam,eye);gl.uniform1f(PG.u.uT,now);
  gl.uniform1i(PG.u.uSM,0);gl.uniform1f(PG.u.uSMt,1/SMS);gl.uniform4f(PG.u.uG,pose.px,pose.pz,bpulse+pulse*.5,0);
  gl.bindVertexArray(grassVAO);gl.drawElementsInstanced(gl.TRIANGLES,GB.ix.length,gl.UNSIGNED_SHORT,0,grassN);
  // particles: solid confetti/water, then additive glows
  let n=0;for(const p of parts){if(n>=PMAX)break;const o=n*8,fl=.6+.4*Math.abs(sin(now*8+p.ph));ptData.set([p.p[0],p.p[1],p.p[2],p.sz*fl*520,p.c[0],p.c[1],p.c[2],Math.min(1,p.l*2)],o);n++;}
  const nSolid=n;for(const m of MOTES){if(n>=PMAX)break;const x=m.p[0]+Math.sin(now*.23+m.ph)*.4,y=m.p[1]+Math.sin(now*.31+m.ph*2)*.15,z=m.p[2]+Math.cos(now*.19+m.ph)*.4,tw=.5+.5*Math.sin(now*2+m.ph*5);ptData.set([x,y,z,7*m.s,1.,.85,.55,.35*tw],n*8);n++;}
  for(const g of GLOWS){if(n>=PMAX)break;const k=.55+.35*sin(now*5+g.p[0]*4+g.p[2]*4)+pulse*.3;ptData.set([g.p[0],g.p[1],g.p[2],70,g.c[0]*k,g.c[1]*k,g.c[2]*k,.55],n*8);n++;}
  gl.useProgram(PP.p);gl.uniformMatrix4fv(PP.u.uVP,false,VP);gl.uniform1f(PP.u.uScale,cv.height/900);gl.bindVertexArray(ptVAO);gl.bindBuffer(gl.ARRAY_BUFFER,ptBuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,ptData,0,n*8);
  gl.enable(gl.BLEND);gl.depthMask(false);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.uniform1f(PP.u.uSoft,0);gl.drawArrays(gl.POINTS,0,nSolid);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.uniform1f(PP.u.uSoft,1);gl.drawArrays(gl.POINTS,nSolid,n-nSolid);gl.depthMask(true);gl.disable(gl.BLEND);
  if(POST)runPost(proj,VP,eye,sun,now);

  document.getElementById('beat').style.opacity=.25+.75*pulse;
  if(performance.now()>bannerUntil)document.getElementById('banner').style.opacity=0;
  uiT+=dt;if(uiT>.04){uiT=0;
    if(game.state==='play'){document.getElementById('score').textContent=game.score.toLocaleString();document.getElementById('combo').textContent=`combo ${game.combo}  ·  ×${mult()}`;
      document.getElementById('hype').style.width=game.hype+'%';const S=sbeat();
      const up=game.chart.filter(c=>!c.done&&S>=c.t-4&&S<=c.t+CONFIG.win).slice(0,2);
      const el=document.getElementById('calls');el.innerHTML=up.map(c=>{const p=clamp(1-(c.t-S)/4,0,1)*100,nowC=Math.abs(S-c.t)<.3;
        return`<div class="call${nowC?' now':''}"><div class="ring" style="--p:${p}%"><span>${MOVE_ICON[c.m]}</span></div>${MOVE_NAME[c.m]}</div>`;}).join('');
      const want=up[0]?up[0].m:null;for(const b of document.querySelectorAll('#moves button'))b.classList.toggle('want',b.dataset.m===want);}
    else if(game.state!=='paused'){document.getElementById('calls').innerHTML='';for(const b of document.querySelectorAll('#moves button'))b.classList.remove('want');}}
  window.__game={state:game.state==='free'?'play':game.state,score:game.score,combo:game.combo,hype:Math.round(game.hype),level:game.lastSection,move:dance.cur.id,
    player:{x:+pose.px.toFixed(3),y:+pose.py.toFixed(3),yaw:+pose.yaw.toFixed(2)},won:game.won};
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
// debug hook for screenshots: ?pose=hat&t=1.3 freezes a move at a beat
buildGnome(p=>{document.getElementById('load').textContent='Sculpting the gnome… '+Math.round(p*100)+'%';}).then(()=>{
  document.getElementById('load').textContent='';if(game.pending){const f=game.pending==='free';game.pending=null;startGame(f);}});

window.__setMove=(id)=>setMove(id,gbeat(),performance.now()/1000);
